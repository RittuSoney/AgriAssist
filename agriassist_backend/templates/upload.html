<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriAssist AI | Disease Predictor</title>
    <style>
        :root {
            --primary: #2E7D32;
            --surface: #ffffff;
            --background: #f4f7f6;
            --text: #333333;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--surface);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 { margin-top: 0; color: var(--primary); }
        .upload-box {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        .upload-box:hover { border-color: var(--primary); }
        input[type="file"] { display: none; }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        button:hover { background-color: #1B5E20; }
        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            background-color: #e8f5e9;
            display: none;
        }
        .disease-name { font-weight: bold; font-size: 1.2rem; color: var(--primary); }
        .confidence-bar-container {
            width: 100%;
            background-color: #ddd;
            border-radius: 4px;
            height: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        .confidence-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AgriAssist AI</h1>
        <p>Upload a plant leaf image for instant diagnosis.</p>

        <!-- The Upload Form -->
        <form id="uploadForm">
            <label class="upload-box" id="dropzone">
                <span id="fileName">Click to select an image</span>
                <input type="file" id="imageInput" name="image" accept="image/*" required>
            </label>
            <button type="submit" id="submitBtn">Analyze Leaf</button>
        </form>

        <!-- The Results Box -->
        <div id="result">
            <div class="disease-name" id="diseaseName"></div>
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 8px;">
                <span>Confidence</span>
                <span id="confidenceText">0%</span>
            </div>
            <div class="confidence-bar-container">
                <div class="confidence-bar" id="confidenceBar"></div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const fileNameDisplay = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');
        
        // Update file name when selected
        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = e.target.files[0].name;
            }
        });

        // Handle the API submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop page from refreshing
            
            const file = imageInput.files[0];
            if (!file) return;

            // Package the image
            const formData = new FormData();
            formData.append('image', file);

            // Update UI to show loading state
            submitBtn.textContent = "Analyzing...";
            submitBtn.disabled = true;
            resultDiv.style.display = "none";

            try {
                // Send to Django Backend
                const response = await fetch('/api/agri/predict/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // Render the result
                    document.getElementById('diseaseName').textContent = data.disease.replace(/_/g, ' ');
                    document.getElementById('confidenceText').textContent = data.confidence + '%';
                    document.getElementById('confidenceBar').style.width = data.confidence + '%';
                    resultDiv.style.display = "block";
                } else {
                    alert("Error: " + data.error);
                }
            } catch (error) {
                console.error("Fetch error:", error);
                alert("Failed to connect to the prediction server.");
            } finally {
                // Reset button
                submitBtn.textContent = "Analyze Leaf";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
